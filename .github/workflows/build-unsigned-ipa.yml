name: Build unsigned iPhone test app

on:
  workflow_dispatch:
    inputs:
      recognition_trace:
        description: "Build with optional Recognition Trace diagnostics panel (runtime default OFF)"
        required: false
        default: false
        type: boolean
      model_source:
        description: "模型来源：现有模型、ManTou YOLO11s，或外部 Core ML 包"
        required: true
        default: cdpcre
        type: choice
        options:
          - cdpcre
          - mantou-yolo11s
          - external-coreml
      external_coreml_url:
        description: "外部 .mlpackage/.mlmodel/.zip 下载地址（选择 external-coreml 时必填）"
        required: false
        type: string
      external_coreml_sha256:
        description: "可选 SHA-256；填写后会校验下载文件"
        required: false
        type: string
      external_model_id:
        description: "外部模型标识（仅用于构建元数据）"
        required: false
        default: external-model
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Export model and package IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure diagnostics build metadata
        env:
          TRACE_BUILD: ${{ inputs.recognition_trace }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('project.yml')
          value = path.read_text()
          revision = os.environ['GITHUB_SHA']
          value = value.replace('    SWIFT_VERSION: "5.0"', '    SWIFT_VERSION: "5.0"\n    INFOPLIST_KEY_TraceSourceRevision: "' + revision + '"')
          if os.environ['TRACE_BUILD'] == 'true':
              value = value.replace('    SWIFT_VERSION: "5.0"', '    SWIFT_VERSION: "5.0"\n    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) RECOGNITION_TRACE"')
          path.write_text(value)
          PY
      - name: Use a stable Python version for Core ML export
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up the Core ML export tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements-export.txt

      - name: Download and export the card model
        shell: bash
        env:
          MODEL_SOURCE: ${{ inputs.model_source }}
          EXTERNAL_COREML_URL: ${{ inputs.external_coreml_url }}
          EXTERNAL_COREML_SHA256: ${{ inputs.external_coreml_sha256 }}
          EXTERNAL_MODEL_ID: ${{ inputs.external_model_id }}
        run: |
          set -euo pipefail
          source .venv/bin/activate
          case "$MODEL_SOURCE" in
            cdpcre)
              python scripts/export_coreml.py \
                --download \
                --model-id cdpcre-french-cards
              ;;
            mantou-yolo11s)
              # Pin the source revision and hash so a later upstream change
              # cannot silently change the comparison model.
              mantou_url="https://raw.githubusercontent.com/ManTou-Tou/poker-card-detection/16b6f7f75dec73ab8e61d76e3927a8260d37bdf4/deploy/cards_yolo11s_best.pt"
              mantou_sha256="012ed21c4b58d178ebb8fb10e4b06cd4d7b05734b4d7c044246a8db2978d3fd2"
              mkdir -p models
              curl --fail --location --retry 3 --silent --show-error \
                "$mantou_url" \
                --output models/mantou-yolo11s.pt
              echo "$mantou_sha256  models/mantou-yolo11s.pt" | shasum -a 256 -c -
              python scripts/export_coreml.py \
                --weights models/mantou-yolo11s.pt \
                --model-id mantou-yolo11s \
                --image-size 416
              ;;
            external-coreml)
              test -n "$EXTERNAL_COREML_URL" || {
                echo "external_coreml_url is required for external-coreml" >&2
                exit 2
              }
              # Preserve a recognized suffix so a direct .mlmodel download is
              # accepted by export_coreml.py. Archives are still detected by
              # content, so URLs with query strings remain usable.
              external_name="${EXTERNAL_COREML_URL##*/}"
              external_name="${external_name%%\?*}"
              case "$external_name" in
                *.mlmodel) external_suffix=".mlmodel" ;;
                *.mlpackage) external_suffix=".mlpackage" ;;
                *) external_suffix=".zip" ;;
              esac
              external_model_path="/tmp/card-detector-external-model${external_suffix}"
              curl --fail --location --retry 3 --silent --show-error \
                "$EXTERNAL_COREML_URL" \
                --output "$external_model_path"
              if [[ -n "$EXTERNAL_COREML_SHA256" ]]; then
                echo "$EXTERNAL_COREML_SHA256  $external_model_path" | shasum -a 256 -c -
              else
                echo "Warning: external model SHA-256 was not supplied; review the downloaded artifact before distribution." >&2
              fi
              python scripts/export_coreml.py \
                --coreml-source "$external_model_path" \
                --model-id "$EXTERNAL_MODEL_ID"
              ;;
            *)
              echo "Unsupported model_source: $MODEL_SOURCE" >&2
              exit 2
              ;;
          esac

      - name: Generate the Xcode project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          candidates = sorted(Path('App').rglob('CardDetector.mlpackage')) + sorted(Path('App').rglob('CardDetector.mlmodel'))
          if len(candidates) != 1:
              raise SystemExit('Expected exactly one bundled model for trace identity')
          package = candidates[0]
          digest = hashlib.sha256()
          for item in (sorted(package.rglob('*')) if package.is_dir() else [package]):
              if item.is_file():
                  digest.update((item.relative_to(package).as_posix() if package.is_dir() else item.name).encode())
                  digest.update(b'\0')
                  digest.update(item.read_bytes())
          if not package.exists():
              raise SystemExit('Cannot locate bundled model for trace identity')
          project = Path('project.yml')
          project.write_text(project.read_text().replace('    SWIFT_VERSION: "5.0"',
              '    SWIFT_VERSION: "5.0"\n    INFOPLIST_KEY_TraceModelSHA256: "' + digest.hexdigest() + '"'))
          PY
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: Run Swift unit tests on iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -project CardScanMagic.xcodeproj \
            -scheme CardScanMagic \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -resultBundlePath build/TraceTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build an unsigned device app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project CardScanMagic.xcodeproj \
            -scheme CardScanMagic \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          if [[ '${{ inputs.recognition_trace }}' == 'true' ]]; then
            xcodebuild -project CardScanMagic.xcodeproj -scheme CardScanMagic \
              -configuration Release -sdk iphoneos \
              -derivedDataPath "$PWD/build/NormalDerivedData" \
              SWIFT_ACTIVE_COMPILATION_CONDITIONS="" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          fi

          app_path="$PWD/build/DerivedData/Build/Products/Release-iphoneos/CardScanMagic.app"
          test -d "$app_path"
          mkdir -p build/Payload
          cp -R "$app_path" build/Payload/
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/CardScanMagic-unsigned.ipa

      - name: Upload the unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: CardScanMagic-unsigned-ipa
          path: build/CardScanMagic-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Swift-test-results
          path: build/TraceTests.xcresult
          if-no-files-found: ignore
          retention-days: 14
