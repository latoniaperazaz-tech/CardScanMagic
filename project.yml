name: CardScanMagic
options:
  bundleIdPrefix: com.example
  # The GitHub macOS 14 image builds with Xcode 15.4. Pin the generated
  # project format so a newer XcodeGen release does not emit Xcode 16 files.
  xcodeVersion: "15.0"
  projectFormat: "xcode15_0"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  CardScanMagic:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cardscanmagic
        PRODUCT_NAME: CardScanMagic
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Card Scan Magic
        INFOPLIST_KEY_NSCameraUsageDescription: "Use the rear camera to recognize playing cards dealt above the phone."
        # Supplying a launch storyboard opts the app into the device's native
        # screen size. Without it, iOS can place a newly sideloaded app in a
        # legacy 3:2 compatibility canvas, which appears as large black bars
        # above and below the camera preview on an iPhone 14 Pro.
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies: []
  CardScanMagicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: CardScanMagic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cardscanmagic.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CardScanMagic.app/CardScanMagic"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  CardScanMagic:
    build:
      targets:
        CardScanMagic: all
        CardScanMagicTests: [test]
    test:
      targets:
        - CardScanMagicTests
